name: Build and publish container

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux x64 image
        run: docker build --platform linux/amd64 --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t bambu-bridge:ci .

      - name: Verify bundled plugin and MCP
        run: |
          set -euo pipefail
          name=$(docker run -d --network host bambu-bridge:ci)
          trap 'docker logs "$name"; docker rm -fv "$name"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --max-time 5 \
            http://127.0.0.1:8080/health | jq -e '.loaded and .agent_ready'
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | jq -e '.result.capabilities.tools != null'
          docker exec "$name" grep -Fx 'block_cloud = 0' /data/obn.conf

      - name: Save verified image for publishing
        if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))
        run: docker save bambu-bridge:ci | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: verified-container
          path: image.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-container

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image to GHCR
        run: |
          set -euo pipefail
          docker load -i image.tar.gz
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA}"
          docker tag bambu-bridge:ci "$image:$tag"
          docker push "$image:$tag"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=latest
          fi
          docker tag bambu-bridge:ci "$image:$tag"
          docker push "$image:$tag"
