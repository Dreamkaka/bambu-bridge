name: Build Bambu Bridge

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build & Self-Test (Linux g++)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++ make cmake libopenh264-dev libjpeg-turbo8-dev

      - name: Show toolchain
        run: g++ --version && cmake --version

      - name: Build bridge and self-test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      # --- Run self-test (does NOT need the plugin) ---
      - name: Run self-test
        run: ./build/bambu-bridge-self-test

      - name: Test cloud commands and Web API without credentials or vendor binaries
        run: |
          mkdir -p build/test-plugin
          g++ -std=c++17 -fPIC -shared -pthread -Iinclude tests/cloud_fixture.cpp -o build/test-plugin/libbambu_networking.so
          g++ -std=c++17 -fPIC -shared -Iinclude tests/source_fixture.cpp -o build/test-plugin/libBambuSource.so
          python3 tests/cloud_commands.py build/bambu-bridge build/test-plugin
          python3 tests/web_api.py build/bambu-bridge build/test-plugin
          python3 tests/printer_files.py build/bambu-bridge build/test-plugin

      # --- Smoke test: CLI help works ---
      - name: Smoke test CLI
        run: |
          ./build/bambu-bridge --help >/dev/null && echo "CLI OK"

      - name: Include codec notices
        run: |
          cp /usr/share/doc/libopenh264-dev/copyright build/openh264-copyright.txt
          cp /usr/share/doc/libjpeg-turbo8-dev/copyright build/libjpeg-turbo-copyright.txt

      - name: Package bridge with Open Bamboo Networking
        run: |
          python3 packaging/bundle.py linux_x64 build/bambu-bridge artifacts/bambu-bridge-linux-x64 build/*-copyright.txt

      - name: Smoke test packaged plugin
        run: |
          mkdir build/package-smoke
          tar -xzf artifacts/bambu-bridge-linux-x64.tar.gz -C build/package-smoke
          cfg=$(mktemp -d)
          build/package-smoke/run.sh --config-dir "$cfg" --http 0 --stdio </dev/null
          grep -Fx 'block_cloud = 0' "$cfg/obn.conf"

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: bamboo-bridge-linux
          path: artifacts/bambu-bridge-linux-x64.tar.gz
          if-no-files-found: error

  build-windows-msvc:
    name: Build (Windows MSVC — ABI compatible with bamboo_networking.dll)
    runs-on: windows-latest
    # MSVC is the ONLY way to ABI-correctly call the MSVC-built .dll on Windows.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Install static camera codecs
        run: '& "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openh264:x64-windows-static-md libjpeg-turbo:x64-windows-static-md'

      - name: Build with MSVC (CMake)
        run: |
          cmake -S . -B build_msvc -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build build_msvc --config Release --target bambu-bridge

      - name: Include codec notices
        run: |
          $share = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/share"
          Copy-Item "$share/openh264/copyright" build_msvc/Release/openh264-copyright.txt
          Copy-Item "$share/libjpeg-turbo/copyright" build_msvc/Release/libjpeg-turbo-copyright.txt

      - name: Package bridge with Open Bamboo Networking
        run: |
          $release = 'build_msvc/Release'
          python packaging/bundle.py win_x64 "$release/bambu-bridge.exe" artifacts/bambu-bridge-windows-x64 "$release/openh264-copyright.txt" "$release/libjpeg-turbo-copyright.txt"

      - name: Smoke test packaged plugin
        run: |
          Expand-Archive artifacts/bambu-bridge-windows-x64.zip build_msvc/package-smoke
          $cfg = Join-Path $env:RUNNER_TEMP 'bambu-bridge-smoke'
          '{"method":"status"}' | & build_msvc/package-smoke/run.bat --config-dir $cfg --http 0 --stdio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$cfg/obn.conf" -Pattern '^block_cloud = 0$' -Quiet)) { exit 1 }

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: bamboo-bridge-windows-msvc
          path: artifacts/bambu-bridge-windows-x64.zip
          if-no-files-found: error
