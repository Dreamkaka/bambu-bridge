<!doctype html>
<!--
  变体：工地，动效改为冷静（amber / warm / wide / hatch / standard / calm）
  主视觉：圆环上的进度、喷嘴、热床和剩余时间，旁边是温度曲线和进度柱
  页面类型：控制台
-->
<html lang="zh-CN" data-ef-accent="amber" data-ef-paper="warm" data-ef-cut="wide" data-ef-ground="hatch" data-ef-density="standard" data-ef-motion="calm">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>打印 · bambu-bridge</title>
    <script>
      try {
        const t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#F3F1EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1A17" media="(prefers-color-scheme: dark)" />
  </head>
  <body class="ef ef-contours">
    <div class="ef-tri" aria-hidden="true"><i></i><i></i><i></i></div>
    <header class="ef-cmdbar">
      <a class="brand" href="#job"><span class="seal" aria-hidden="true">B</span>BRIDGE</a>
      <nav aria-label="分区">
        <a href="#job" data-view="job">当前打印<small>Job</small></a>
        <a href="#printers" data-view="printers">设备<small>Printers</small><span class="count" id="need-count" hidden>0</span></a>
        <a href="#camera" data-view="camera">画面<small>Camera</small></a>
      </nav>
      <div class="util">
        <span class="ef-state" id="link-state">连接中</span>
        <button class="ef-btn small" type="button" data-theme-toggle>深浅</button>
      </div>
    </header>
    <main id="app"></main>
    <dialog class="ef-dialog" id="stop-dialog" aria-labelledby="stop-title">
      <div class="ef-panel">
        <p class="ef-eyebrow slash">Stop</p>
        <h2 id="stop-title">停止这次打印？</h2>
        <p id="stop-copy">将停止当前任务。已经打出来的部分会留在热床上。</p>
        <p class="ef-actions">
          <button class="ef-btn small" type="button" data-close>取消</button>
          <button class="ef-btn small go" type="button" data-close="stop">停止打印</button>
        </p>
      </div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
